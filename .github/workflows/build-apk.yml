name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional release keystore from secrets
        env:
          KS_B64: ${{ secrets.ALLPDF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ALLPDF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        id: build
        env:
          ALLPDF_KEYSTORE_PASSWORD: ${{ secrets.ALLPDF_KEYSTORE_PASSWORD }}
          ALLPDF_KEY_ALIAS: ${{ secrets.ALLPDF_KEY_ALIAS }}
          ALLPDF_KEY_PASSWORD: ${{ secrets.ALLPDF_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
        continue-on-error: true

      - name: Verify APK
        id: verify
        if: steps.build.outcome == 'success'
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" AllPDF-Pro.apk
          {
            echo "== build-tools $BT =="
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs AllPDF-Pro.apk
            echo "== badging =="
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging AllPDF-Pro.apk | head -40
            echo "== permissions =="
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump permissions AllPDF-Pro.apk
            echo "== size =="
            ls -la AllPDF-Pro.apk
            echo "== dex/lib entries =="
            unzip -l AllPDF-Pro.apk | grep -E "classes|\.so$|tessdata|assets/" | head -40
          } > verify.txt 2>&1
          cat verify.txt

      - name: Publish results to ci-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no build log" > /tmp/out/build.log
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log > /tmp/out/errors.txt 2>/dev/null || true
          cp verify.txt /tmp/out/ 2>/dev/null || true
          cp AllPDF-Pro.apk /tmp/out/ 2>/dev/null || true
          echo "sha=${GITHUB_SHA} run=${GITHUB_RUN_NUMBER} build=${{ steps.build.outcome }} verify=${{ steps.verify.outcome }}" > /tmp/out/status.txt
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "CI run ${GITHUB_RUN_NUMBER} for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      - name: Upload APK artifact
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AllPDF-Pro-apk
          path: AllPDF-Pro.apk

      - name: GitHub Release
        if: steps.verify.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AllPDF Pro build ${{ github.run_number }}
          files: AllPDF-Pro.apk
          body: Automated build from ${{ github.sha }}. Install on Android 8.0+ (API 26+).

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
